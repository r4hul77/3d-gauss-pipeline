x-build-args: &build_args
  UID: ${UID}
  GID: ${GID}
  USERNAME: ${USERNAME}
  NVIDIA_CUDA_VERSION: ${NVIDIA_CUDA_VERSION}

services:
  hello:
    container_name: hello_service
    build:
      context: ../services/hello
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
  colmap:
    container_name: colmap_service
    build:
      context: ../services/colmap
      dockerfile: Dockerfile
      args:
        NVIDIA_CUDA_VERSION: ${NVIDIA_CUDA_VERSION}
    runtime: nvidia
    restart: unless-stopped
  3dgrut:
    container_name: 3dgrut_service
    runtime: nvidia
    build:
      context: ../../ThirdParty/3dgrut
      dockerfile: Dockerfile
    tty: true
    stdin_open: true
    restart: unless-stopped
  supersplat:
    container_name: supersplat_service
    build:
      context: ../services/supersplat
      dockerfile: Dockerfile
      args:
        SUPERSPLAT_REF: v2.16.1
    ports:
      - "3001:3000"
  huggingface:
    build:
      context: ../services/huggingface
      dockerfile: Dockerfile
  
  huggingface_user:
    runtime: nvidia
    tty: true
    stdin_open: true
    volumes:
      - ../../src:/workspace
      - /dev/shm:/dev/shm
      - ../../test:/test
    environment:
      - HF_TOKEN=${HUGGINGFACE_TOKEN}
    env_file:
      - ../../.env
    build:
      context: ../services/user
      dockerfile: Dockerfile
      args:
        <<: *build_args
      additional_contexts:
        runtime: "service:huggingface"

  hello_user:
    build:
      context: ../services/user
      dockerfile: Dockerfile
      args:
        <<: *build_args
      additional_contexts:
        runtime: "service:hello"
  colmap_user:
    runtime: nvidia
    tty: true
    stdin_open: true
    build:
      context: ../services/user
      dockerfile: Dockerfile
      args:
        <<: *build_args
      additional_contexts:
        runtime: "service:colmap"
  3dgrut_user:
    runtime: nvidia
    tty: true
    stdin_open: true
    build:
      context: ../services/user
      dockerfile: Dockerfile
      args:
        <<: *build_args
      additional_contexts:
        runtime: "service:3dgrut"  
    # Many JS dev servers bind to localhost by default.
    # This tries to force bind to all interfaces; if unsupported, it falls back.
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - ../../.3dgrt_cache:/.3dgrt_cache
      - /dev/shm:/dev/shm
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /home/r4hul/ssd1:/ssd1

    environment:
      - TORCH_EXTENSIONS_DIR=/.3dgrt_cache/torch_extensions
      - CUDA_CACHE_PATH=/.3dgrt_cache/compute_cache
      - CUDA_CACHE_MAXSIZE=2147483648
      - PIP_CACHE_DIR=/.3dgrt_cache/pip
      - CCACHE_DIR=/.3dgrt_cache/ccache
      - TORCH_HOME=/.3dgrt_cache/torch
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - DISPLAY=${DISPLAY}