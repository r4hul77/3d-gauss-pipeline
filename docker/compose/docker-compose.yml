x-build-args: &build_args
  UID: ${UID}
  GID: ${GID}
  USERNAME: ${USERNAME}

services:
  hello:
    container_name: hello_service
    build:
      context: ../services/hello
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
  colmap:
    container_name: colmap_service
    build:
      context: ../services/colmap
      dockerfile: Dockerfile
    runtime: nvidia
    restart: unless-stopped
  3dgrut:
    container_name: 3dgrut_service
    runtime: nvidia
    build:
      context: ../../ThirdParty/3dgrut
      dockerfile: Dockerfile
    tty: true
    stdin_open: true
    restart: unless-stopped
  supersplat:
    container_name: supersplat_service
    build:
      context: ../services/supersplat
      dockerfile: Dockerfile
      args:
        SUPERSPLAT_REF: v2.16.1
    ports:
      - "3001:3000"
  huggingface:
    build:
      context: ../services/huggingface
      dockerfile: Dockerfile
  
  huggingface_user:
    runtime: nvidia
    tty: true
    stdin_open: true
    volumes:
      - ../../src:/workspace
      - /dev/shm:/dev/shm
      - ../../test:/test
    environment:
      - HF_TOKEN=${HUGGINGFACE_TOKEN}
    env_file:
      - ../../.env
    build:
      context: ../services/user
      dockerfile: Dockerfile
      args:
        <<: *build_args
      additional_contexts:
        runtime: "service:huggingface"

  hello_user:
    build:
      context: ../services/user
      dockerfile: Dockerfile
      args:
        <<: *build_args
      additional_contexts:
        runtime: "service:hello"
  colmap_user:
    runtime: nvidia
    tty: true
    stdin_open: true
    build:
      context: ../services/user
      dockerfile: Dockerfile
      args:
        <<: *build_args
      additional_contexts:
        runtime: "service:colmap"
  3dgrut_user:
    runtime: nvidia
    tty: true
    stdin_open: true
    build:
      context: ../services/user
      dockerfile: Dockerfile
      args:
        <<: *build_args
      additional_contexts:
        runtime: "service:3dgrut"  
    # Many JS dev servers bind to localhost by default.
    # This tries to force bind to all interfaces; if unsupported, it falls back.
    command: sh -lc 'npm run develop -- --host 0.0.0.0 --port 3000 || npm run develop'
    restart: unless-stopped
